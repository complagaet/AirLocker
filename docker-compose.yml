version: '3.8'

services:
  mongo:
    image: mongo
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: coolpassword
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: backend
    restart: always
    ports:
      - "${PORT}:${PORT}"
    environment:
      DB_URL: ${DB_URL}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongo

volumes:
  mongo_data:
